set -g mouse on
set -g history-limit 50000

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window

# Allows us to use C-a a <command> to send commands to a TMUX session inside
# another TMUX session
# bind-key a send-prefix

# Allows for faster key repetition
set -s escape-time 50

# Start numbering at 1
set -g base-index 1

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

set -g allow-rename on

# Apps may not retitle panes: iTerm2 -CC shows #{pane_title} as the tab name
# and Claude Code ignores CLAUDE_CODE_DISABLE_TERMINAL_TITLE for some writes.
# _exec-in-worktrunk seeds pane titles with the branch name instead.
set -g allow-set-title off

set -g set-titles on
set -g set-titles-string '#T'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ',xterm*:RGB:extkeys'
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys always
set -g extended-keys-format csi-u

set -g status-interval 1
set -g status-justify centre # center align window list
set -g status-left-length 20
set -g status-right-length 140

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

set -g pane-border-indicators arrows

set -s set-clipboard on
if-shell "command -v pbcopy" {
    set -s copy-command "pbcopy"
}

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'farnots/tmux-claude-status'

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'tpack init'
