onboarding = false
[theme]
name = "rose-pine-dawn"
auto_switch = false

[experimental]
kitty_graphics = true

[ui]
show_agent_labels_on_pane_borders = true
sidebar_max_width = 60
# right_click_passthrough_modifier = "option"
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[ui.sidebar.agents]
rows = [
  [ "state_icon", { token = "$pr_emoji", rules = [
    { contains = "\uF4DD", fg = "#8b949e" },  # draft                       
    { contains = "\uF4DB", fg = "#1f6feb" },  # queued to merge             
    { contains = "\uF421", fg = "#db6d28" },  # conflict                    
    { contains = "\uF52F", fg = "#f85149" },  # check failed, others running
    { contains = "\uF530", fg = "#f85149" },  # check failed, settled       
    { contains = "\uF46A", fg = "#d29922" },  # checks running              
    { contains = "\uF441", fg = "#79c0ff" },  # review required             
    { contains = "\uF426", fg = "#db61a2" },  # thrown out of the queue     
    { contains = "\uF4F4", fg = "#ff7b72" },  # blocked                     
    { contains = "\uF42E", fg = "#7ee787" },  # only optional failing       
    { contains = "\uF4A4", fg = "#3fb950" },  # mergeable                   
    { contains = "\uF419", fg = "#a371f7" },  # merged                      
    { contains = "\uF4DC", fg = "#6e7681" },  # closed                      
    { contains = "\uF420", fg = "#6e7681" },  # no pull request             
    { contains = "\uF442", fg = "#39c5cf" },  # conversation open           
  ] },
  { token = "$bookmark" }, 
  "workspace", "tab", { token = "$stack", rules = [
    { equals = "\ue711\ue70e", fg = "#9061e8" },  # iOS and Android together (KMP)
    { equals = "\ue711", fg = "#7c7c82" },        # iOS/macOS
    { equals = "\ue70e", fg = "#0d9152" },        # Android
    { equals = "\ue7a8", fg = "#c2571a" },        # Rust
    { equals = "\ue724", fg = "#0087a8" },        # Go
    { equals = "\ue718", fg = "#4c8f3a" },        # Node
    { equals = "\ue73c", fg = "#3d7fbf" },        # Python
  ] }],
]

[ui.sidebar.spaces]
rows = [
  [ "state_icon", { token = "$pr_emoji", rules = [
    { contains = "\uF4DD", fg = "#8b949e" },  # draft                       
    { contains = "\uF4DB", fg = "#1f6feb" },  # queued to merge             
    { contains = "\uF421", fg = "#db6d28" },  # conflict                    
    { contains = "\uF52F", fg = "#f85149" },  # check failed, others running
    { contains = "\uF530", fg = "#f85149" },  # check failed, settled       
    { contains = "\uF46A", fg = "#d29922" },  # checks running              
    { contains = "\uF441", fg = "#79c0ff" },  # review required             
    { contains = "\uF426", fg = "#db61a2" },  # thrown out of the queue     
    { contains = "\uF4F4", fg = "#ff7b72" },  # blocked                     
    { contains = "\uF42E", fg = "#7ee787" },  # only optional failing       
    { contains = "\uF4A4", fg = "#3fb950" },  # mergeable                   
    { contains = "\uF419", fg = "#a371f7" },  # merged                      
    { contains = "\uF4DC", fg = "#6e7681" },  # closed                      
    { contains = "\uF420", fg = "#6e7681" },  # no pull request             
    { contains = "\uF442", fg = "#39c5cf" },  # conversation open           
  ] },
  { token = "$bookmark" }, 
  "workspace",
  { token = "$stack", rules = [
    { equals = "\ue711\ue70e", fg = "#9061e8" },  # iOS and Android together (KMP)
    { equals = "\ue711", fg = "#7c7c82" },        # iOS/macOS
    { equals = "\ue70e", fg = "#0d9152" },        # Android
    { equals = "\ue7a8", fg = "#c2571a" },        # Rust
    { equals = "\ue724", fg = "#0087a8" },        # Go
    { equals = "\ue718", fg = "#4c8f3a" },        # Node
    { equals = "\ue73c", fg = "#3d7fbf" },        # Python
  ] }],
  ["branch", "git_status"],
]

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

# ----------------------------------

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "ctrl+alt+shift+w"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch (no prefix)"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

# Worktree from a purpose / ticket URL, named by Apple's on-device model, scaffolded in the
# background (local plugin: local-plugins/wt-purpose). prefix+shift+n is free: new_workspace
# moved to ctrl+alt+w below.
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "bonkey.wt-purpose.create"
description = "Worktree from purpose / ticket URL (on-device slug)"

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
open_notification_target = "prefix+U"  # prefix+o now opens annotate doc review
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
switch_tab = "ctrl+1..9"
previous_tab = "ctrl+alt+left"
next_tab = "ctrl+alt+right"
next_agent = "ctrl+alt+down"
previous_agent = "ctrl+alt+up"
next_workspace = "ctrl+alt+shift+down"
previous_workspace = "ctrl+alt+shift+up"
new_tab = "ctrl+alt+t"
new_workspace = "ctrl+alt+w"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
close_tab = "ctrl+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
close_pane = ""          # freed: prefix+x opens the Xcode project (keys.command below); close panes via shell exit / close_tab
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right
# herdr-annotate (plannotator) - terminal annotations + doc/agent-reply review
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selected text"

[[keys.command]]
key = "prefix+Y"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent last reply"

# Workspace navigation and shortcut discovery
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "find workspace or zoxide directory"

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "root=$(herdr plugin list --plugin ramarivera.pretty-which --json | jq -r '.result.plugins[0].plugin_root'); exec \"$root/target/release/herdr-pretty-which\""
width = "95%"
height = "85%"
description = "search Herdr shortcuts"

[[keys.command]]
key = "prefix+backtick"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "wilbeibi.catchup.handoff"
description = "handoff session to a new agent"

# Session history
[[keys.command]]
key = "prefix+M"
type = "plugin_action"
command = "nicosuave.memex.desk"
description = "search past agent sessions"

# Query GitHub now for every workspace's PR emoji (bonkey/herdr-pr-emoji)
[[keys.command]]
key = "prefix+E"
type = "plugin_action"
command = "bonkey.pr-emoji.refresh"
description = "refresh PR emoji"

# Copy the URL of the PR for the branch checked out in the focused pane.
[[keys.command]]
key = "prefix+P"
type = "shell"
command = "url=$(gh pr view --json url --jq .url) && printf %s \"$url\" | pbcopy && herdr notification show 'PR URL copied' --body \"$url\" || herdr notification show 'No PR for this branch'"
description = "copy PR URL"

# Open the PR of the branch checked out in the focused pane. Shell commands run
# from that pane's working directory, so plain `gh pr view -w` hits the right
# repo and branch. prefix+p is free: previous_tab is bound to ctrl+alt+left.
[[keys.command]]
key = "prefix+p"
type = "shell"
command = "gh pr view -w"
description = "open PR in browser"

# Duplicate the focused pane's running command into a new tab (local plugin: local-plugins/dup-tab)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "bonkey.dup-tab.duplicate"
description = "duplicate running command in new tab"

# Open the focused pane's working directory in an app (shell commands run from that cwd).
# Uppercase letters = "open cwd in X".
[[keys.command]]
key = "prefix+F"
type = "shell"
command = "open ."
description = "open Finder in current folder"

[[keys.command]]
key = "prefix+Z"
type = "shell"
command = "zed ."
description = "open Zed in current folder"

[[keys.command]]
key = "prefix+X"
type = "shell"
command = "xed ."
description = "open Xcode in current folder"

# Open the nearest Xcode project/workspace from the focused pane's cwd (~/bin/xcode-proj open, the .x alias)
[[keys.command]]
key = "prefix+x"
type = "shell"
command = "~/bin/xcode-proj open"
description = "open Xcode project (.x)"

# Bookmarks: three independent marks per workspace, shown as $bookmark at the
# start of both sidebar rows (local plugin: bonkey/herdr-bookmark).
# prefix+1..3 are free because switch_tab is bound to ctrl+1..9 above.
[[keys.command]]
key = "prefix+1"
type = "plugin_action"
command = "bonkey.bookmark.toggle-1"
description = "toggle bookmark 1 (−)"

[[keys.command]]
key = "prefix+2"
type = "plugin_action"
command = "bonkey.bookmark.toggle-2"
description = "toggle bookmark 2 (=)"

[[keys.command]]
key = "prefix+3"
type = "plugin_action"
command = "bonkey.bookmark.toggle-3"
description = "toggle bookmark 3 (≡)"

[[keys.command]]
key = "prefix+0"
type = "plugin_action"
command = "bonkey.bookmark.clear"
description = "clear bookmarks"
